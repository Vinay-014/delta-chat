[tool.poetry]
name = "pathnovo-delta-chat"
version = "1.0.0"
description = "Production-grade P&ID document revision delta engine and grounded chat system with spatial citations."
authors = ["PathNovo AI Engineering <eng@pathnovo.ai>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.28.0"}
pydantic = "^2.6.0"
pydantic-settings = "^2.2.0"
streamlit = "^1.32.0"
pdfplumber = "^0.11.0"
pypdf = "^4.1.0"
pdf2image = "^1.17.0"
pytesseract = "^0.3.10"
google-genai = ">=0.1.0"
chromadb = "^0.4.24"
sentence-transformers = "^2.5.0"
rank-bm25 = "^0.2.2"
opentelemetry-api = "^1.23.0"
opentelemetry-sdk = "^1.23.0"
opentelemetry-instrumentation-fastapi = "^0.44b0"
prometheus-client = "^0.20.0"
redis = "^5.0.3"
httpx = "^0.27.0"
jinja2 = "^3.1.3"
numpy = "^1.26.4"
pandas = "^2.2.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.0"
pytest-asyncio = "^0.23.5"
pytest-cov = "^4.1.0"
pre-commit = "^3.6.2"
black = "^24.3.0"
isort = "^5.13.2"
flake8 = "^7.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
